<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1180" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Marcador de Flecha -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4ade80"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc"/>
    </marker>

    <!-- Filtros de Sombra -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- TÍTULO PRINCIPAL -->
  <text x="480" y="42" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="0.5">DIAGRAMA DE FLUJO E2E — PERSONALIZACIÓN COMERCIAL (NBO + MOVISTAR TOTAL)</text>
  <text x="480" y="65" text-anchor="middle" fill="#94a3b8" font-size="12">Hackathon AI Telecom Challenge 2026 • Arquitectura IA Tipo 2 (Human-in-the-Loop)</text>

  <!-- ==================== FASE 1: FUENTES DE DATOS ==================== -->
  <g transform="translate(40, 85)">
    <rect width="880" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect x="15" y="12" width="6" height="22" rx="3" fill="#0284c7"/>
    <text x="30" y="28" fill="#38bdf8" font-size="14" font-weight="700">1. FUENTES DE DATOS Y CONTEXTO DEL CLIENTE</text>

    <!-- 4 Cajas de Datos -->
    <rect x="30" y="45" width="190" height="50" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
    <text x="125" y="67" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="600">Planta de Clientes</text>
    <text x="125" y="83" text-anchor="middle" fill="#94a3b8" font-size="10">Demografía, Antigüedad, ARPU</text>

    <rect x="245" y="45" width="190" height="50" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
    <text x="340" y="67" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="600">Parque y Servicios</text>
    <text x="340" y="83" text-anchor="middle" fill="#94a3b8" font-size="10">Móvil, Fibra Hogar, MT</text>

    <rect x="460" y="45" width="190" height="50" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
    <text x="555" y="67" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="600">Historial Operativo</text>
    <text x="555" y="83" text-anchor="middle" fill="#94a3b8" font-size="10">Reclamos, Averías, Consentimiento</text>

    <rect x="675" y="45" width="175" height="50" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
    <text x="762" y="67" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="600">Catálogo de Ofertas</text>
    <text x="762" y="83" text-anchor="middle" fill="#94a3b8" font-size="10">Upgrades, MT, Portabilidad</text>
  </g>

  <!-- Flecha 1 -> 2 -->
  <path d="M 480 195 L 480 230" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ==================== FASE 2: MOTOR NBO HÍBRIDO ==================== -->
  <g transform="translate(40, 235)">
    <rect width="880" height="135" rx="12" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect x="15" y="12" width="6" height="22" rx="3" fill="#818cf8"/>
    <text x="30" y="28" fill="#a5b4fc" font-size="14" font-weight="700">2. MOTOR NBO HÍBRIDO (FastAPI Backend / Rules + ML)</text>

    <!-- Componentes del Motor -->
    <rect x="30" y="48" width="250" height="68" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1.2"/>
    <text x="155" y="72" text-anchor="middle" fill="#e0e7ff" font-size="12" font-weight="700">Reglas de Negocio Puras</text>
    <text x="155" y="90" text-anchor="middle" fill="#94a3b8" font-size="10">Elegibilidad MT, Políticas y</text>
    <text x="155" y="104" text-anchor="middle" fill="#94a3b8" font-size="10">Ventanas de Cooldown (Rechazo)</text>

    <!-- Flecha interna -->
    <path d="M 280 82 L 315 82" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow-purple)"/>

    <rect x="325" y="48" width="250" height="68" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="450" y="72" text-anchor="middle" fill="#ede9fe" font-size="12" font-weight="700">Inferencia Predictiva ML</text>
    <text x="450" y="90" text-anchor="middle" fill="#94a3b8" font-size="10">Scoring Propensión de Compra</text>
    <text x="450" y="104" text-anchor="middle" fill="#94a3b8" font-size="10">+ Estimación de Riesgo de Churn</text>

    <!-- Flecha interna -->
    <path d="M 575 82 L 610 82" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow-purple)"/>

    <rect x="620" y="48" width="230" height="68" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.2"/>
    <text x="735" y="72" text-anchor="middle" fill="#fae8ff" font-size="12" font-weight="700">Ranking Comercial Ponderado</text>
    <text x="735" y="90" text-anchor="middle" fill="#f472b6" font-size="10.5" font-weight="600">Top-1 NBO • Top-2 Rebate • Top-3</text>
    <text x="735" y="104" text-anchor="middle" fill="#94a3b8" font-size="10">Con % Probabilidad por Oferta</text>
  </g>

  <!-- Flecha 2 -> 3 -->
  <path d="M 480 370 L 480 405" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ==================== FASE 3: GUARDRAILS OPERATIVOS ==================== -->
  <g transform="translate(40, 410)">
    <rect width="880" height="120" rx="12" fill="#2d1d05" stroke="#b45309" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect x="15" y="12" width="6" height="22" rx="3" fill="#f59e0b"/>
    <text x="30" y="28" fill="#fcd34d" font-size="14" font-weight="700">3. GUARDRAILS OPERATIVOS Y CONTROL DE FRICCIÓN (Mentora Luz Herrera)</text>

    <!-- Rombo de Decisión -->
    <polygon points="170,45 285,78 170,110 55,78" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="170" y="74" text-anchor="middle" fill="#fef3c7" font-size="11" font-weight="700">¿Reclamo o Avería</text>
    <text x="170" y="89" text-anchor="middle" fill="#fef3c7" font-size="11" font-weight="700">en curso?</text>

    <!-- Camino Sí -->
    <path d="M 285 78 L 340 78" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>
    <text x="312" y="70" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="700">SÍ</text>

    <rect x="350" y="50" width="230" height="58" rx="8" fill="#451a03" stroke="#f97316" stroke-width="1.2"/>
    <text x="465" y="72" text-anchor="middle" fill="#ffedd5" font-size="11.5" font-weight="700">⚠️ ALERTA OPERATIVA</text>
    <text x="465" y="88" text-anchor="middle" fill="#fed7aa" font-size="10">Suspender venta agresiva.</text>
    <text x="465" y="100" text-anchor="middle" fill="#fed7aa" font-size="10">Priorizar retención / descuento temporal.</text>

    <!-- Camino No / Normal -->
    <path d="M 170 110 L 170 118 L 600 118 L 600 85 L 610 85" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="210" y="115" fill="#4ade80" font-size="10" font-weight="700">NO (Línea Normal)</text>

    <rect x="620" y="50" width="230" height="58" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <text x="735" y="72" text-anchor="middle" fill="#d1fae5" font-size="11.5" font-weight="700">Generación XAI + Speech</text>
    <text x="735" y="88" text-anchor="middle" fill="#a7f3d0" font-size="10">¿Por qué a este cliente? + Ahorro</text>
    <text x="735" y="100" text-anchor="middle" fill="#a7f3d0" font-size="10">Argumentarios de valor y rebate</text>
  </g>

  <!-- Flecha 3 -> 4 -->
  <path d="M 480 530 L 480 565" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ==================== FASE 4: OMNICANALIDAD ==================== -->
  <g transform="translate(40, 570)">
    <rect width="880" height="115" rx="12" fill="#064e3b" stroke="#059669" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect x="15" y="12" width="6" height="22" rx="3" fill="#34d399"/>
    <text x="30" y="28" fill="#6ee7b7" font-size="14" font-weight="700">4. CANALES DE DISTRIBUCIÓN Y EXPERIENCIA OMNICANAL</text>

    <!-- Tienda Física -->
    <rect x="30" y="45" width="260" height="55" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <text x="160" y="66" text-anchor="middle" fill="#f0fdf4" font-size="12" font-weight="700">🏬 Tienda Física</text>
    <text x="160" y="82" text-anchor="middle" fill="#94a3b8" font-size="10.5">Vista ágil en viñetas y % propensión</text>
    <text x="160" y="94" text-anchor="middle" fill="#6ee7b7" font-size="9.5">Sin speech robotizado (respeto al asesor)</text>

    <!-- Call Center -->
    <rect x="310" y="45" width="260" height="55" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <text x="440" y="66" text-anchor="middle" fill="#f0fdf4" font-size="12" font-weight="700">📞 Call Center (In / Out)</text>
    <text x="440" y="82" text-anchor="middle" fill="#94a3b8" font-size="10.5">Speech guiado persuasivo</text>
    <text x="440" y="94" text-anchor="middle" fill="#6ee7b7" font-size="9.5">Objeciones y switch a Rebate en vivo</text>

    <!-- WhatsApp / App -->
    <rect x="590" y="45" width="260" height="55" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <text x="720" y="66" text-anchor="middle" fill="#f0fdf4" font-size="12" font-weight="700">💬 WhatsApp / App Mi Movistar</text>
    <text x="720" y="82" text-anchor="middle" fill="#94a3b8" font-size="10.5">Autogestión digital inteligente</text>
    <text x="720" y="94" text-anchor="middle" fill="#38bdf8" font-size="9.5">Hand-off asistido a asesor humano</text>
  </g>

  <!-- Flecha 4 -> 5 -->
  <path d="M 480 685 L 480 720" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ==================== FASE 5: EJECUCIÓN COMERCIAL Y REBATE ==================== -->
  <g transform="translate(40, 725)">
    <rect width="880" height="155" rx="12" fill="#4c0519" stroke="#be123c" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect x="15" y="12" width="6" height="22" rx="3" fill="#fb7185"/>
    <text x="30" y="28" fill="#fecdd3" font-size="14" font-weight="700">5. EJECUCIÓN COMERCIAL Y FLUJO DE REBATE (Human-in-the-Loop)</text>

    <!-- Oferta Principal -->
    <rect x="30" y="48" width="200" height="85" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="130" y="70" text-anchor="middle" fill="#ffe4e6" font-size="12" font-weight="700">Presentación Top-1</text>
    <text x="130" y="86" text-anchor="middle" fill="#fb7185" font-size="10.5" font-weight="600">Movistar Total / Upgrade</text>
    <text x="130" y="102" text-anchor="middle" fill="#94a3b8" font-size="10">Visualización de % Propensión</text>
    <text x="130" y="116" text-anchor="middle" fill="#94a3b8" font-size="9.5">y Ahorro Mensual</text>

    <!-- Decisión 1 -->
    <polygon points="310,50 375,90 310,130 245,90" fill="#0f172a" stroke="#fb7185" stroke-width="1.2"/>
    <text x="310" y="88" text-anchor="middle" fill="#fecdd3" font-size="10.5" font-weight="700">¿Respuesta</text>
    <text x="310" y="100" text-anchor="middle" fill="#fecdd3" font-size="10.5" font-weight="700">Cliente?</text>

    <!-- Acepta Directo -->
    <path d="M 310 50 L 310 40 L 730 40 L 730 55" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="520" y="35" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="700">Acepta Oferta Principal</text>

    <!-- Rechaza por precio -> Rebate -->
    <path d="M 375 90 L 415 90" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>
    <text x="395" y="82" fill="#fbbf24" font-size="9.5" font-weight="700">Rechazo</text>

    <!-- Caja Rebate -->
    <rect x="425" y="55" width="180" height="72" rx="8" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.2"/>
    <text x="515" y="76" text-anchor="middle" fill="#f3e8ff" font-size="11.5" font-weight="700">🔄 ACTIVACIÓN REBATE</text>
    <text x="515" y="94" text-anchor="middle" fill="#c084fc" font-size="10.5" font-weight="600">Oferta Top-2 / Menor Costo</text>
    <text x="515" y="110" text-anchor="middle" fill="#94a3b8" font-size="10">Alternativa inmediata de contingencia</text>

    <path d="M 605 90 L 635 90" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow-purple)"/>

    <!-- Decisión Rebate -->
    <polygon points="675,65 715,90 675,115 635,90" fill="#0f172a" stroke="#a855f7" stroke-width="1.2"/>
    <text x="675" y="93" text-anchor="middle" fill="#e9d5ff" font-size="9" font-weight="700">¿Acepta?</text>

    <!-- Acepta Rebate -->
    <path d="M 715 90 L 740 90" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow-green)"/>

    <!-- Venta Exitosa -->
    <rect x="745" y="58" width="115" height="42" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
    <text x="802" y="78" text-anchor="middle" fill="#d1fae5" font-size="10" font-weight="700">✅ Venta Aceptada</text>
    <text x="802" y="91" text-anchor="middle" fill="#a7f3d0" font-size="8.5">Emisión DITO / CRM</text>

    <!-- Rechazo Final -->
    <path d="M 675 115 L 675 130 L 745 130" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="745" y="110" width="115" height="38" rx="6" fill="#450a0a" stroke="#f87171" stroke-width="1"/>
    <text x="802" y="126" text-anchor="middle" fill="#fecaca" font-size="9.5" font-weight="700">❌ Rechazo Final</text>
    <text x="802" y="138" text-anchor="middle" fill="#fca5a5" font-size="8">Registro de Motivo</text>
  </g>

  <!-- Flecha 5 -> 6 -->
  <path d="M 480 880 L 480 915" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ==================== FASE 6: TRAZABILIDAD Y FEEDBACK LOOP ==================== -->
  <g transform="translate(40, 920)">
    <rect width="880" height="150" rx="12" fill="#3b0764" stroke="#7e22ce" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect x="15" y="12" width="6" height="22" rx="3" fill="#c084fc"/>
    <text x="30" y="28" fill="#e9d5ff" font-size="14" font-weight="700">6. TRAZABILIDAD E2E, CONVERSIÓN CONFIRMADA Y FEEDBACK LOOP</text>

    <!-- Conversión Real -->
    <rect x="30" y="48" width="220" height="85" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="140" y="70" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="700">🎯 Conversión Real</text>
    <text x="140" y="88" text-anchor="middle" fill="#f1f5f9" font-size="10.5" font-weight="600">Instalación Efectiva + 1er Pago</text>
    <text x="140" y="104" text-anchor="middle" fill="#94a3b8" font-size="9.5">Mitigación de quiebres por</text>
    <text x="140" y="117" text-anchor="middle" fill="#94a3b8" font-size="9.5">plazos de entrega (Luz Herrera)</text>

    <!-- Flecha -->
    <path d="M 250 90 L 290 90" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-purple)"/>

    <!-- Registro y Dashboard -->
    <rect x="300" y="48" width="250" height="85" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="425" y="70" text-anchor="middle" fill="#ede9fe" font-size="12" font-weight="700">Trazabilidad y Dashboard</text>
    <text x="425" y="88" text-anchor="middle" fill="#94a3b8" font-size="10">Log E2E (interacciones_e2e.csv)</text>
    <text x="425" y="104" text-anchor="middle" fill="#c084fc" font-size="10">Embudo Comercial + KPIs de IA</text>
    <text x="425" y="118" text-anchor="middle" fill="#94a3b8" font-size="9.5">Calibración de Acierto en Producción</text>

    <!-- Flecha -->
    <path d="M 550 90 L 590 90" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-purple)"/>

    <!-- Retroalimentación / Recalibración -->
    <rect x="600" y="48" width="250" height="85" rx="8" fill="#0f172a" stroke="#ec4899" stroke-width="1.2"/>
    <text x="725" y="70" text-anchor="middle" fill="#fdf2f8" font-size="12" font-weight="700">🔄 Feedback Loop Activo</text>
    <text x="725" y="88" text-anchor="middle" fill="#f472b6" font-size="10.5" font-weight="600">Reajuste de Pesos y Modelos</text>
    <text x="725" y="104" text-anchor="middle" fill="#94a3b8" font-size="9.5">Ajuste de tiempos de Cooldown</text>
    <text x="725" y="118" text-anchor="middle" fill="#94a3b8" font-size="9.5">por motivo de rechazo</text>
  </g>

  <!-- LÍNEA DE RETROALIMENTACIÓN HACIA ARRIBA -->
  <path d="M 920 970 L 945 970 L 945 300 L 920 300" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
  <text x="940" y="630" fill="#f472b6" font-size="10.5" font-weight="700" transform="rotate(90, 940, 630)" text-anchor="middle">RECALIBRACIÓN CONTINUA DEL MOTOR NBO</text>

  <!-- FOOTER -->
  <text x="480" y="1120" text-anchor="middle" fill="#64748b" font-size="11">Desafío 02 • Telefónica del Perú / Movistar + Universidad de Lima + Lenovo ISG</text>
</svg>
